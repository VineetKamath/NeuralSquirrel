# Deploys the live lab to a Hugging Face Docker Space on every push to main.
# Repository settings → Secrets and variables → Actions:
#   secret   HF_TOKEN  (Hugging Face access token with write permission)
#   variable HF_SPACE  (e.g. your-username/squirrel-lab)
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # a Space reads its settings from the front matter of README.md
          { printf -- '---\ntitle: Squirrel Lab\nemoji: 🐿️\ncolorFrom: green\ncolorTo: gray\nsdk: docker\napp_port: 7860\npinned: true\n---\n\n'; cat README.md; } > README.space.md
          mv README.space.md README.md
          rm -rf .git
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
