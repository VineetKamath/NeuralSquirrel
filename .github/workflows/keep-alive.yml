# Free Hugging Face Spaces pause after 48 hours without visitors; a visit every 6 hours keeps the lab running.
# Repository variable LIVE_URL: the public URL of the lab (e.g. https://your-username-squirrel-lab.hf.space)
name: Keep the live lab awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.LIVE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --max-time 60 "${{ vars.LIVE_URL }}/api/status"
